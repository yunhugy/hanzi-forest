name: Build Android APK

# 手动触发，或推送 v* 标签时自动构建
on:
  workflow_dispatch:
    inputs:
      note:
        description: 本次构建说明（可选）
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 JS 依赖
        run: npm install

      - name: 生成原生工程（自动应用签名插件）
        run: npx expo prebuild --platform android --clean

      - name: 优化 Android 构建参数（定向 arm64-v8a 架构与 4GB 内存）
        run: |
          python3 -c "
          import re
          path = 'android/gradle.properties'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if not content.endswith('\n'):
              content += '\n'
          content = re.sub(r'^reactNativeArchitectures=.*$', 'reactNativeArchitectures=arm64-v8a', content, flags=re.MULTILINE)
          content = re.sub(r'^org\.gradle\.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m', content, flags=re.MULTILINE)
          content += 'android.enablePngCrunchInReleaseBuilds=false\n'
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          echo "=== 优化后的 gradle.properties 末尾 15 行 ==="
          tail -n 15 android/gradle.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 secret：ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: 构建 release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-forest-arm64-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
